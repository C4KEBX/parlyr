<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PARLYR — Creative solutions, engineered with AI.</title>
<meta name="description" content="Creative solutions for businesses, brands, and agencies ready to move at the speed of AI.">
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: var(--ink);
    color: var(--vanilla-cream);
    font-family: "Helvetica Neue", sans-serif;
    scroll-behavior: smooth;
  }
  * { box-sizing: border-box; }
  body { min-height: 100vh; }
  ::selection { background: var(--signal); color: var(--ink); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: var(--carbon); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--signal); }

  .nav-brand { cursor: pointer; position: relative; padding: 6px 2px; }
  .nav-brand::after {
    content: ""; position: absolute;
    left: 2px; right: 2px; bottom: 2px; height: 1px;
    background: var(--signal);
    transform: scaleX(0); transform-origin: left center;
    transition: transform 240ms var(--ease-out);
  }
  .nav-brand:hover::after { transform: scaleX(1); }
  .nav-brand:hover img {
    filter: drop-shadow(0 0 12px rgba(242,107,31,.55));
    transform: translateY(-1px);
  }

  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(16px) }
    100% { opacity: 1; transform: translateY(0) }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="landing/Bits.jsx"></script>
<script type="text/babel" src="landing/Nav.jsx"></script>
<script type="text/babel" src="landing/Hero.jsx"></script>
<script type="text/babel" src="landing/Services.jsx"></script>
<script type="text/babel" src="landing/Why.jsx"></script>
<script type="text/babel" src="landing/Contact.jsx"></script>
<script type="text/babel" src="landing/Footer.jsx"></script>

<script type="text/babel">
const App = () => (
  <>
    <Nav />
    <main>
      <Hero />
      <Services />
      <Why />
      <Contact />
    </main>
    <Footer />
  </>
);
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
